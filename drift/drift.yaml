# yaml-language-server: $schema=https://download.pactflow.io/drift/schemas/drift.testcases.v1.schema.json

# Drift test case definitions.
#
# This file defines the test operations that Drift will execute against the
# running API server (started in-process by tests/drift.rs). For each
# operation, Drift will:
#   1. Fire an `operation:started` event — pact_broker.lua calls
#      POST /test/setup/{operationId} (a test-only route tests/drift.rs
#      mounts alongside the real app), which seeds the DB via the same
#      TestDataBuilder helpers the rest of the test suite uses, and returns
#      whatever it generated (UUIDs, a pact-version SHA) as JSON.
#   2. Send the HTTP request described by the target OAS operationId. Any
#      generated value from step 1 that a request needs is read back out of
#      pact_broker.lua via ${functions:...}, since it can't be hardcoded here.
#   3. Validate the response against the OAS (status code, schema, headers).
#   4. Fire an `operation:finished` event — pact_broker.lua calls
#      POST /test/reset, truncating the DB so operations don't see each
#      other's state.
#
# Sources:
#   oas-pb-rs — the OpenAPI spec (mounted by the app itself) that Drift
#               validates responses against
#   functions — pact_broker.lua, providing the lifecycle hooks above and the
#               ${functions:...} accessors used below
#
# The operation key (left-hand side under `operations:`) is passed verbatim
# to POST /test/setup/{operationId}, so it must match a `match` arm in
# tests/drift.rs's `seed_state`, not the OAS operationId (see `target:`).
# Fixed values below (consumer/provider names, version numbers, branch, tag,
# label, environment) are chosen by seed_state's `fixtures` module, not
# generated — see tests/drift.rs.

drift-testcase-file: v1
title: "Pact Broker API Tests"

sources:
  - name: oas-pb-rs
    # The spec is copied in from the Rust broker's repo, where it lives at the
    # repo root; here it sits beside this file.
    path: openapi.json
  - name: functions
    path: pact_broker.lua

plugins:
  - name: oas           # validates responses against the OpenAPI spec
  - name: json          # JSON request/response handling
  - name: junit-output  # writes a JUnit XML report to output/reports/junit/

