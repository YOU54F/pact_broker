        tag: prod
        to: prod
    expected:
      response:
        # 200 is shields.io's answer, not ours: the badge routes reply 307 and
        # redirect there, and Drift's HTTP client follows redirects with no way
        # to turn that off (no `drift verify` flag, nothing in the testcase
        # schema). So this operation only asserts that the route exists and
        # redirects somewhere reachable — the 307, its Location header and the
        # badge text are covered by the unit tests in src/api/resources/badges.rs.
        statusCode: 200

